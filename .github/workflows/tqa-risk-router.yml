
name: TQA - Risk Router (Free)

on:
  workflow_run:
    workflows: ["TQA - Validate and Open PR"]
    types: [completed]

  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to classify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tqa-router-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Inspect PR and route labels
        uses: actions/github-script@v8
        env:
          TQA_ROUTER_DRY_RUN: ${{ vars.TQA_ROUTER_DRY_RUN || 'true' }}
          TQA_AUTO_CLOUD_FIX: ${{ vars.TQA_AUTO_CLOUD_FIX || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const route = require('./.github/scripts/tqa-risk-router.cjs');
            await route({ github, context, core, env: process.env });
