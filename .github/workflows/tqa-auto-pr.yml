
name: TQA - Validate and Open PR

on:
  push:
    branches:
      - 'feature/QA-*'

permissions:
  contents: read

concurrency:
  group: tqa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.marker.outputs.ready }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check readiness marker
        id: marker
        run: |
          if git log -1 --format=%B | grep -Fq '[tqa-pr-ready]'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

  create-pr:
    needs: validate
    if: needs.validate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list \
            --head "$BRANCH" \
            --state all \
            --json number \
            --jq 'length')

          if [ "$existing" -gt 0 ]; then
            echo "PR already exists or existed."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "TQA: $BRANCH" \
            --body "Automated PR after successful validation.

          Branch: $BRANCH

          Checks: install, typecheck, build, test.
          Independent AI code review pending.
          Human approval required before merge."
